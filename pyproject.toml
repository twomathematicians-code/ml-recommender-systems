[tool.poetry]
name = "recommender-systems"
version = "1.0.0"
description = "Hybrid recommender engine: collaborative filtering, content-based, FAISS vector search, and A/B testing framework."
authors = ["Mahesh Solanki"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
scikit-learn = "^1.5"
faiss-cpu = "^1.8"
scipy = "^1.13"
numpy = "^1.26"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
